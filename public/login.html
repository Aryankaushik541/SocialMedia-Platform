<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login · CodeGram</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body>
<header class="nav"><div class="container nav-inner"><a href="/" class="logo">Code<span>Gram</span></a><nav class="nav-links" id="nav-links"></nav></div></header>
<main class="container"><div class="card auth-wrap"><h2>Log in</h2><div id="msg"></div>
  <form id="login-form">
    <div class="field"><label>Email</label><input type="email" name="email" required></div>
    <div class="field"><label>Password</label><input type="password" name="password" required></div>
    <button class="btn btn-primary" style="width:100%" type="submit">Login</button>
  </form>
  <p style="text-align:center;margin-top:16px;color:var(--muted)">New here? <a href="/register.html">Create account</a></p>
  <p style="text-align:center;color:var(--muted);font-size:13px">Demo: aryan@demo.com / password123</p>
</div></main>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/auth-page.js"></script></body></html>
